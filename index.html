<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Express</title>
  <style>
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --texto: #1f2430;
      --suave: #6b7280;
      --borda: #e2e5ee;
      --primaria: #4f46e5;
      --primaria-hover: #4338ca;
      --erro: #dc2626;
      --erro-bg: #fef2f2;
      --ok-bg: #eef2ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --card: #1b1e27;
        --texto: #e8eaf0;
        --suave: #9aa1b2;
        --borda: #2a2e3a;
        --primaria: #6366f1;
        --primaria-hover: #818cf8;
        --erro: #f87171;
        --erro-bg: #2a1a1c;
        --ok-bg: #22253a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }

    .subtitulo {
      margin: 0 0 24px;
      color: var(--suave);
      font-size: 0.9rem;
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--suave);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: transparent;
      color: var(--texto);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primaria);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .operacoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primaria);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--primaria-hover); }
    button:active { transform: scale(0.98); }

    .resultado {
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      background: var(--ok-bg);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .resultado.erro {
      background: var(--erro-bg);
      color: var(--erro);
    }

    [hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Calculadora</h1>
    <p class="subtitulo">Requisições POST com Express</p>

    <form id="form">
      <div class="campos">
        <label>
          Valor A
          <input type="number" id="a" step="any" placeholder="0" required>
        </label>
        <label>
          Valor B
          <input type="number" id="b" step="any" placeholder="0" required>
        </label>
      </div>

      <div class="operacoes">
        <button type="button" data-op="soma">Somar</button>
        <button type="button" data-op="subtracao">Subtrair</button>
        <button type="button" data-op="multiplicacao">Multiplicar</button>
        <button type="button" data-op="divisao">Dividir</button>
      </div>
    </form>

    <div id="resultado" class="resultado" hidden></div>
  </main>

  <script>
    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');

    function mostrar(texto, erro) {
      resultado.textContent = texto;
      resultado.classList.toggle('erro', erro);
      resultado.hidden = false;
    }

    document.querySelectorAll('button[data-op]').forEach((botao) => {
      botao.addEventListener('click', async () => {
        if (!form.reportValidity()) return;

        const a = Number(document.getElementById('a').value);
        const b = Number(document.getElementById('b').value);

        try {
          const resposta = await fetch('/' + botao.dataset.op, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ a, b })
          });
          const texto = await resposta.text();
          mostrar(texto, !resposta.ok);
        } catch (e) {
          mostrar('Não foi possível conectar ao servidor.', true);
        }
      });
    });
  </script>
</body>
</html>
